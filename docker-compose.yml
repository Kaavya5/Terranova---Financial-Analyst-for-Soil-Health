version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: ag_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-soil_analysis}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d soil_analysis"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml_service:
    build:
      context: ./ml_service
    container_name: ag_ml_service
    restart: always
    environment:
      - PORT=8001
    ports:
      - "8001:8001"
    command: >
      bash -c "python scripts/train_models.py && uvicorn main:app --host 0.0.0.0 --port 8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/doc"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: ag_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      ml_service:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-soil_analysis}
      - ML_SERVICE_URL=http://ml_service:8001
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-supersecretkey}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: ag_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
